<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historica Analyst Hub</title>
<style>
:root{--bg:#0a1020;--side:#0e172a;--card:#131f34;--line:#273751;--txt:#e8eef9;--mut:#8a9bb4;--mut2:#9aaac2;--blue:#4e9bff;--teal:#5fd6b8;--amber:#f1c477;--violet:#c08bff;--red:#f08a8a;--green:#70e0b7;--field:#0d182b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);border-right:1px solid #23304a;padding:24px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex:none}
.brand{font-size:22px;font-weight:800;letter-spacing:-.7px;padding:4px 12px}.brand span{color:#6bb8ff}
.sub{color:#8190aa;font-size:11px;letter-spacing:1.7px;text-transform:uppercase;padding:0 12px;margin:2px 0 28px}
.nav{width:100%;text-align:left;color:#9dacc4;background:none;border:0;padding:11px 12px;border-radius:10px;margin:2px 0;display:flex;gap:10px;align-items:center;font-size:14px}
.nav:hover,.nav.active{background:#203457;color:#fff}.nav b{width:20px;text-align:center;font-weight:400}
.nav .cnt{margin-left:auto;font-size:11px;background:#2a3d5e;border-radius:10px;padding:1px 7px;color:#bcd3f5}
.foot{margin-top:auto;color:#75849f;font-size:11.5px;padding:10px 12px;line-height:1.5}
.foot button{margin-top:8px}
.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1560px;margin:auto}
.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}
.eyebrow{color:#66b5ff;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1.6px}
h1{font-size:28px;margin:6px 0 5px;letter-spacing:-.6px}h2{font-size:16px;margin:0}h3{font-size:13.5px;margin:0 0 8px}
p{color:var(--mut2);margin:0;line-height:1.55}
.pill{border:1px solid #35547a;background:#142741;border-radius:30px;color:#8bcaff;padding:8px 13px;font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.metric{color:#93a5bf;font-size:12px}.number{font-size:27px;font-weight:750;margin:8px 0 3px}
.trend{color:#61d4a4;font-size:12px}.trend.warn{color:var(--amber)}.muted{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin:16px 0}
.grid.eq{grid-template-columns:1fr 1fr}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.barrow{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;margin:11px 0;font-size:12px;color:#b6c5d9}
.track{background:#24324a;height:9px;border-radius:12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4e8af0,#65d5c0);border-radius:12px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12.5px}
th[data-ts]{cursor:pointer;user-select:none}th[data-ts]:hover{color:#c9d6e8}.tsi{color:#5f728c;margin-left:4px;font-size:11px}
th{color:#8598b2;font-weight:600;padding:11px 9px;border-bottom:1px solid #2b3950;white-space:nowrap}
td{padding:11px 9px;border-bottom:1px solid #25334a;color:#d7e0ee;vertical-align:middle}tr:last-child td{border:0}
table.rz th{position:relative;overflow:hidden;text-overflow:ellipsis}table.rz td{overflow:hidden;overflow-wrap:anywhere}table.rz .inl,table.rz .mini,table.rz textarea.inl{width:100%!important;max-width:100%;min-width:0}
.rzh{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}.rzh:hover,.rzh.on{background:#4e9bff66}
td a{color:#8bcaff;text-decoration:none}td a:hover{text-decoration:underline}
.status{display:inline-block;padding:4px 9px;border-radius:20px;background:#263955;color:#a8c9ff;font-size:11px;white-space:nowrap}
.status.green{background:#173c37;color:var(--green)}.status.amber{background:#47371f;color:var(--amber)}.status.red{background:#4a2630;color:var(--red)}
.btn{background:#438cf0;border:0;border-radius:9px;color:#fff;padding:9px 13px;font-size:12px;font-weight:700}
.btn.secondary{background:#253853;color:#c9def7}.btn.small{padding:6px 10px;font-size:11.5px}.btn:hover{filter:brightness(1.1)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#1a2a43;border:1px solid #31445f;color:#b9c9dd;border-radius:8px;padding:8px 13px;font-size:13px}
.tab.active{background:#28508a;color:#fff;border-color:#3d6db4}
.seg{display:inline-flex;background:#0d182b;border:1px solid #30425e;border-radius:9px;padding:3px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:7px;color:#9fb2cc;font-size:12.5px}
.seg button.active{background:#28508a;color:#fff}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
.field,.mini{background:var(--field);border:1px solid #30425e;border-radius:8px;padding:10px;width:100%;font-size:13px}
.mini{padding:5px 7px;width:auto;font-size:12px;max-width:150px}
.inl{background:transparent;border:1px dashed #3a4f6e;border-radius:6px;padding:4px 7px;font-size:12px;width:150px;color:#d7e0ee}
textarea.field{min-height:340px;resize:vertical;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.note{background:#17283e;border:1px solid #2e4d6e;border-radius:11px;padding:12px 14px;color:#b3cce5;font-size:12px;line-height:1.6;margin:14px 0 0}
.note.warn{background:#2e2616;border-color:#5b4a22;color:#ecd7a6}
.tag{font-size:10.5px;border-radius:5px;padding:2px 6px;background:#2b2147;color:#cdb0ff;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.now{background:#173c37;color:var(--green)}
.spark{width:100%;display:block}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#aebfd6;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fn{display:grid;grid-template-columns:minmax(120px,190px) 1fr 150px;gap:12px;align-items:center;margin:9px 0;font-size:12.5px}
.fn .bar{height:30px;background:#1b2a42;border-radius:7px;overflow:hidden;position:relative}
.fn .bar div{height:100%;background:linear-gradient(90deg,#3f78d8,#4e9bff);border-radius:7px}
.fn code,.ev{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c7dcff}
.fn .drop{font-size:11px;color:var(--amber)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:8px;background:#0f1b30;border:1px solid #2c405d;border-radius:9px;padding:7px 10px}
.step .n{width:22px;height:22px;border-radius:50%;background:#28508a;font-size:11px;display:grid;place-items:center;flex:none}
.step .ev{flex:1}.ibtn{background:none;border:0;color:#8ea3c0;padding:3px 6px;border-radius:5px}.ibtn:hover{background:#243652;color:#fff}
.tpls{display:flex;flex-direction:column;gap:7px}
.tpl{text-align:left;background:#0f1b30;border:1px solid #2c405d;border-radius:10px;padding:10px 12px}
.tpl.active{border-color:#4e9bff;background:#17294a}.tpl b{display:block;font-size:13px}.tpl span{font-size:11px;color:var(--mut)}
.preview{background:#f6f3ea;color:#222;border-radius:10px;padding:18px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:380px;overflow:auto;font-family:Georgia,serif}
.preview mark{background:#ffd76a;color:#5a3d00;border-radius:3px;padding:0 2px}
.preview .subj{font-family:Inter,sans-serif;font-weight:700;border-bottom:1px solid #d9d2bd;padding-bottom:8px;margin-bottom:12px;display:block}
.score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.issue{font-size:12.5px;padding:7px 10px;border-radius:8px;margin:6px 0;background:#2e2616;color:#ecd7a6}
.issue.ok{background:#173c37;color:var(--green)}.issue.bad{background:#4a2630;color:#f4b3b3}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vars label{font-size:11px;color:var(--mut)}.vars input{margin-top:3px;padding:7px 9px;font-size:12.5px}
iframe.dash{width:100%;height:420px;border:1px solid #30425e;border-radius:10px;background:#0d182b}
.mock{display:grid;place-items:center;height:260px;border:1px dashed #3a4f6e;border-radius:10px;color:var(--mut);text-align:center;padding:20px;font-size:13px}
.hide{display:none!important}
.mqgrid{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mqpanel{background:#0f1b30;border:1px solid #2c405d;border-radius:12px;padding:10px 12px 6px}
.mqpanel .hd{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.mqpanel svg{display:block;width:100%;height:auto;margin-top:4px}
.mqg .mqb{fill:#3987e5}.mqg:hover .mqb,.mqg:focus-within .mqb{fill:#6aa7f0}.mqg rect.mqh{fill:transparent;outline:none}
#mqtip{position:fixed;z-index:60;pointer-events:none;background:#0a1020;border:1px solid #36496a;border-radius:9px;padding:8px 10px;font-size:12px;color:var(--txt);box-shadow:0 6px 20px #0008;max-width:260px}
#mqtip .v{font-size:15px;font-weight:700;display:flex;gap:7px;align-items:center}#mqtip .k{width:12px;height:3px;border-radius:2px;background:#3987e5;display:inline-block}
#mqtip .s{color:#c3d1e6;margin-top:2px}#mqtip .m{color:var(--mut);margin-top:3px}
.cov{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.covrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:12.5px}
.covcells{display:grid;grid-template-columns:repeat(60,1fr);gap:2px}
.covcells i{height:20px;border-radius:3px;background:#1a2a43;display:block}.covcells i.g{background:#70e0b7}.covcells i.b{background:#4e9bff}.covcells i.o{background:#f1a04e}.covcells i.r{background:#f06a6a}
.covcells span{font-size:9.5px;color:var(--mut);white-space:nowrap;height:12px}
.covleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.covleg b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.rm{display:grid;grid-template-columns:150px repeat(6,minmax(180px,1fr));gap:8px;min-width:1300px;align-items:start}
.rmq{font-size:12px;font-weight:700;color:#cfe0f7;padding:4px 6px}.rmq small{display:block;color:var(--mut);font-weight:400}
.rml{border-left:4px solid var(--c);padding:6px 10px;font-weight:700;font-size:13px}.rml small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.rmc{display:flex;flex-direction:column;gap:8px;min-height:20px}
.rmi{background:#0f1b30;border:1px solid #2c405d;border-left:3px solid var(--c);border-radius:9px;padding:9px 10px;font-size:12.5px}
.status.idea{opacity:.75}
code{background:#0d182b;border-radius:4px;padding:1px 5px;font-size:11.5px}
@media(max-width:1100px){.stats,.stats.five,.stats.six{grid-template-columns:repeat(2,1fr)}.grid,.grid.eq{grid-template-columns:1fr}.main{padding:22px}}
@media(max-width:720px){.side{width:60px;padding:14px 5px}.brand{font-size:13px;padding:6px}.brand span,.sub,.nav .t,.nav .cnt,.foot{display:none}.nav{justify-content:center;padding:12px 6px}.main{padding:16px}.pill{display:none}.fn{grid-template-columns:1fr}.barrow{grid-template-columns:96px 1fr 44px}.vars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">H<span>istorica</span></div>
  <div class="sub">Analyst Hub</div>
  <nav id="nav"></nav>
  <div class="foot">Historica Analyst Hub<br>Data lives in your database.<br>Funds, conferences and communities are searched by AI services.</div>
</aside>
<main class="main">
  <div class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="pill" id="syncpill">● Loading…</div></div>
  <div id="content"></div>
</main>
</div>
<script>
/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=(a,b)=>b?((a/b)*100).toFixed(a/b<.1?1:0)+'%':'—';
const hash=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
const rnd=(seed,i)=>{const x=Math.sin(seed*12.9898+i*78.233)*43758.5453;return x-Math.floor(x)};
const series=(seed,n,a,b,noise=.06)=>Array.from({length:n},(_,i)=>Math.max(0,(a+(b-a)*i/(n-1))*(1+(rnd(seed,i)-.5)*2*noise)));
const COL=['#4e9bff','#5fd6b8','#f1c477','#c08bff'];
const stat=(a,b,c,w)=>`<div class="card"><div class="metric">${a}</div><div class="number">${b}</div><div class="trend ${w?'warn':''}">${c||''}</div></div>`;
const card=x=>`<div class="card">${x}</div>`;
const bars=rows=>rows.map(([a,n,l])=>`<div class="barrow"><span>${esc(a)}</span><div class="track"><div class="fill" style="width:${Math.min(100,n)}%"></div></div><span>${l??n+'%'}</span></div>`).join('');
const table=(h,r)=>`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const badge=s=>{const g=/^(accepted|yes|replied|applied|in conversation|pilot|form|both|interview|active)$/i,a=/^(planned|pending|drafted|sent|contacted|to apply|open)$/i,r=/^(rejected|declined|no response)$/i;return `<span class="status ${g.test(s)?'green':a.test(s)?'amber':r.test(s)?'red':''}">${esc(s)}</span>`};
const sel=(opts,val,fn)=>`<select class="mini" onchange="${fn}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
function line(sets,h=170,lb){const W=600,all=sets.flatMap(s=>s.d),mx=Math.max(...all)*1.08,n=sets[0].d.length;
 const X=i=>i/(n-1)*W,Y=v=>h-6-v/mx*(h-16);
 const grid=[0,1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${6+i*(h-12)/3}" y2="${6+i*(h-12)/3}" stroke="#2a3a54" vector-effect="non-scaling-stroke"/>`).join('');
 const paths=sets.map((s,k)=>{const p=s.d.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return (sets.length===1?`<path d="${p} L${W} ${h} L0 ${h}Z" fill="${COL[k]}" opacity=".15"/>`:'')+`<path d="${p}" fill="none" stroke="${COL[k]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`}).join('');
 return `<svg class="spark" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">${grid}${paths}</svg><div class="axis">${lb?lb.map(x=>`<span>${esc(x)}</span>`).join(''):`<span>12 weeks ago</span><span>peak ${fmt(Math.max(...all))}</span><span>this week</span>`}</div>`+(sets.length>1||sets[0].name?`<div class="legend">${sets.map((s,k)=>`<span><i style="background:${COL[k]}"></i>${esc(s.name||'')}</span>`).join('')}</div>`:'')}

 const long=sents.filter(s=>s.split(/\s+/).length>32);if(long.length)add('warn',`${long.length} very long sentence(s) — e.g. “${long[0].slice(0,70)}…”`,6);

 const A=Object.values(by).sort((a,b)=>b.done-a.done||b.open-a.open),all=A.reduce((s,a)=>({done:s.done+a.done,open:s.open+a.open,prog:s.prog+a.prog,over:s.over+a.over,cyc:s.cyc.concat(a.cyc)}),{done:0,open:0,prog:0,over:0,cyc:[]}),mc=median(all.cyc);
 const wk=Array(12).fill(0),cr=Array(12).fill(0);J.forEach(i=>{if(i.resolved){const w=Math.floor(dayDiff(i.resolved,t)/7);if(w>=0&&w<12)wk[11-w]++}if(i.created){const w=Math.floor(dayDiff(i.created,t)/7);if(w>=0&&w<12)cr[11-w]++}});
 const maxOpen=Math.max(1,...A.map(a=>a.open)),late=J.filter(i=>i.cat!=='done').sort((a,b)=>(a.updated||'').localeCompare(b.updated||'')).slice(0,10);
 return `${jiraBar()}<div class="stats five">${stat('Resolved · '+tpWin+'d',all.done,'issues done')}${stat('Open now',all.open,all.prog+' in progress')}${stat('Overdue',all.over,'open past due date',1)}${stat('Median cycle time',mc==null?'—':(mc<1?'<1':Math.round(mc))+' d','created → resolved')}${stat('Story points · '+tpWin+'d',A.reduce((s,a)=>s+a.pts,0)||'—','needs points field')}</div>
 ${card(`<div class="sectionhead"><h2>By person</h2><div class="actions"><select class="mini" onchange="tpWin=+this.value;render()">${[14,30,60,90].map(n=>`<option value="${n}" ${n===tpWin?'selected':''}>Last ${n} days</option>`).join('')}</select>${updBtn('jira')}</div></div>${updInfo('jira')}
 ${table(['Person','Resolved','Open','In progress','Overdue','Stale (>14d)','Median cycle','Points','Workload'],A.map(a=>{const m=median(a.cyc);return [`<b>${esc(a.n)}</b>`,a.done,a.open,a.prog,a.over?`<span class="trend warn">${a.over}</span>`:0,a.stale?`<span class="trend warn">${a.stale}</span>`:0,m==null?'—':Math.round(m)+' d',a.pts||'—',`<div class="track" style="width:120px"><div class="fill" style="width:${Math.round(a.open/maxOpen*100)}%"></div></div>`]}))}
 <div class="note">Throughput and cycle time only mean something if everyone updates Jira consistently. Use them for planning and spotting overload, not for ranking people.</div>`)}
 <div class="grid eq" style="margin-top:16px">${card(`<h2 style="margin-bottom:10px">Created vs resolved · 12 weeks</h2>${line([{d:cr,name:'Created'},{d:wk,name:'Resolved'}],150)}<div class="note">If “created” stays above “resolved”, the backlog is growing.</div>`)}
 ${card(`<h2 style="margin-bottom:10px">Oldest untouched open issues</h2>${table(['Issue','Assignee','Status','Updated','Due'],late.map(i=>[link(i.key,i.url)+'<div class="muted" style="max-width:240px">'+esc(i.summary)+'</div>',esc(i.assignee),esc(i.status),esc(i.updated),i.due?(i.due<t?`<span class="trend warn">${esc(i.due)}</span>`:esc(i.due)):'—']))}`)}</div>`}

/* ---- Rivals ---- */
const vclass=v=>GOOD.test(v)?'green':/^(behind|unproven)$/i.test(v)?'red':'amber';
function rivals(){const R=S.rivals,D=S.rivalDirs,idx=[...R.keys()].filter(i=>visible(R[i],rivalFilter)).sort(cmp('rivals')),vis=R.filter(x=>!x.hidden);
 const good=D.filter(x=>GOOD.test(x.verdict)),bad=D.filter(x=>!GOOD.test(x.verdict)),M=S.mapq,avg=k=>M.length?M.reduce((a,x)=>a+(+x[k]||0),0)/M.length:0;
 const txt=(i,k,w)=>`<textarea class="inl" style="width:${w||210}px;height:74px;resize:vertical" onchange="S.rivals[${i}].${k}=this.value;save()">${esc(R[i][k])}</textarea>`;
 const dirRows=D.map((x,i)=>[`<b>${esc(x.title)}</b><div class="muted">${x.type==='claim'?'our claim':'direction'}</div>`,sel(VERDICTS,x.verdict,`setF('rivalDirs',${i},'verdict',this.value)`)+' <span class="status '+vclass(x.verdict)+'">'+esc(x.verdict)+'</span>',esc(x.best),`<span class="muted" style="display:block;max-width:300px">${esc(x.why)}</span>`,`<span class="muted" style="display:block;max-width:260px">${esc(x.action)}</span>`,`<button class="ibtn" title="Delete row" onclick="delRow('rivalDirs',${i})">🗑</button>`]);
 const mq=M.map((x,i)=>{const n=(k)=>`<input class="inl" type="number" step="0.1" style="width:62px" value="${esc(x[k])}" onchange="S.mapq[${i}].${k}=+this.value;save();render()">`,dl=(x.ours-x.rivals);
  return [`<b>${esc(x.region)}</b> <span class="muted">${esc(x.year)}</span><div class="muted">${esc(x.date||'')}</div>`,n('ours'),n('rivals'),`<b style="color:${dl>=0?'#70e0b7':'#f08a8a'}">${dl>=0?'+':''}${dl.toFixed(1)}</b>`,n('countryOurs')+' / '+n('countryRivals'),n('borderOurs')+' / '+n('borderRivals'),esc(x.best||'—'),esc(x.wrong||'—'),`<textarea class="inl" style="width:200px;height:56px" onchange="S.mapq[${i}].note=this.value;save()">${esc(x.note||'')}</textarea>`,`<button class="ibtn" title="Delete row" onclick="delRow('mapq',${i})">🗑</button>`]});
 return `<div class="stats">${stat('Rivals tracked',vis.length,vis.filter(x=>x.isNew).length+' new from search')}${stat('Where we lead',good.length,'of '+D.length+' directions & claims')}${stat('Where we trail / unproven',bad.length,'needs work',1)}${stat('Map quality vs rivals',M.length?(avg('ours')-avg('rivals')>=0?'+':'')+(avg('ours')-avg('rivals')).toFixed(1):'—',M.length+' benchmark maps · overall score')}</div>
 ${card(`<div class="sectionhead"><h2>Rivals</h2><div class="actions">${updBtn('rivals')}<select class="mini" onchange="rivalFilter=this.value;render()">${['All','New','Hidden'].map(x=>`<option ${x===rivalFilter?'selected':''}>${x}</option>`).join('')}</select><input class="field" id="rvn" style="width:170px" placeholder="Rival name"><input class="field" id="rvu" style="width:190px" placeholder="https://…"><button class="btn small" onclick="addRival()">+ Add</button></div></div>${updInfo('rivals')}
 ${idx.length?table([th('rivals','name','Rival'),'Their market','What’s new','What we can take','Historica vs them',th('rivals','lastChecked','Checked'),''],idx.map(i=>{const x=R[i];return [(x.link&&x.link!=='#'?`<a href="${esc(x.link)}" target="_blank" rel="noopener"><b>${esc(x.name)}</b></a>`:`<b>${esc(x.name)}</b> <span class="tag">no link</span>`)+newTag('rivals',i,x)+(x.link&&x.link!=='#'?'':`<div><input class="inl" placeholder="add URL" style="width:140px;margin-top:4px" onchange="S.rivals[${i}].link=this.value.trim();save();render()"></div>`),txt(i,'market'),txt(i,'whatNew'),txt(i,'take'),`<div class="muted" style="max-width:200px"><span style="color:#70e0b7">＋</span> ${esc(x.better||'—')}<br><span style="color:#f08a8a">－</span> ${esc(x.worse||'—')}</div>`,esc(x.lastChecked||'—'),`${rowActs('rivals',i)}`]})):'<div class="mock">No rivals yet. Press ↻ Update to run the Rivals analysis service, or add one manually.</div>'}
 <div class="note">The <b>Rivals analysis</b> service re-checks each known rival (refreshing <i>What’s new</i> and <i>Checked</i>, never overwriting your other edits) and looks for new ones. Seeded from the Oct 2026 competitive reports in <code>_DOCS/rivals</code>. Verify anything important on the rival’s site — AI search can be wrong.</div>`)}
 <div class="grid eq" style="margin-top:16px">${card(`<h2 style="margin-bottom:10px">Where Historica is ahead</h2>${good.length?good.map(x=>`<div class="issue ok"><b>${esc(x.title)}</b> — ${esc(x.why)}</div>`).join(''):'<p class="muted">Nothing marked yet.</p>'}`)}${card(`<h2 style="margin-bottom:10px">Where Historica is behind or unproven</h2>${bad.length?bad.map(x=>`<div class="issue ${/^(behind|unproven)$/i.test(x.verdict)?'bad':''}"><b>${esc(x.title)}</b> (${esc(x.verdict)}) — ${esc(x.why)}</div>`).join(''):'<p class="muted">Nothing marked yet.</p>'}`)}</div>
 ${card(`<div class="sectionhead"><h2>Directions &amp; claims vs rivals</h2><div class="actions"><input class="field" id="rdt" style="width:230px" placeholder="New direction / claim"><button class="btn small" onclick="addDir()">+ Add</button></div></div>${table(['Direction / claim','Verdict','Best competitor','Why','What to do',''],dirRows)}<div class="note">Verdicts are analyst judgement from public information (Oct 2026), not measured data. Change a verdict when you have evidence. “Most accurate” should stay <b>unproven</b> until the benchmark below is published.</div>`)}
 ${card(`<div class="sectionhead"><h2>Map quality analysis</h2><div class="actions"><label class="btn secondary small">Import benchmark report (.html)<input type="file" accept=".html,.htm" multiple class="hide" onchange="importMapq(this)"></label><input class="field" id="mqr" style="width:170px" placeholder="Region"><input class="field" id="mqy" style="width:70px" placeholder="Year"><input class="field" id="mqo" style="width:70px" type="number" placeholder="Ours"><input class="field" id="mqv" style="width:80px" type="number" placeholder="Rivals"><button class="btn small" onclick="addMapq()">+ Add</button></div></div>
 ${M.length?table(['Map','Ours (overall)','Rivals mean','Δ','Countries ours / rivals','Borders ours / rivals','Best rival','Our wrong borders','Note',''],mq):'<div class="mock" style="height:110px">No benchmarks yet. Import a report or add a row.</div>'}
 <div class="note">Scores come from the rival-comparison benchmark (an LLM extracts which countries and borders each map shows and judges them against history; rivals = mean of 5 maps). Indicative only. Import reads the title and the “Common / Country / Border score” rows of a report like <code>spain_1180.html</code>.</div>`)}`}
function addRival(){const n=document.getElementById('rvn').value.trim();if(!n)return;S.rivals.unshift({name:n,link:document.getElementById('rvu').value.trim()||'#',market:'',whatNew:'',take:'',better:'',worse:'',lastChecked:todayS(),source:'manual'});save();render()}
function addDir(){const n=document.getElementById('rdt').value.trim();if(!n)return;S.rivalDirs.push({type:'claim',title:n,verdict:'Unproven',best:'',why:'',action:''});save();render()}
function addMapq(){const r=document.getElementById('mqr').value.trim(),o=parseFloat(document.getElementById('mqo').value),v=parseFloat(document.getElementById('mqv').value);if(!r||isNaN(o)||isNaN(v)){alert('Enter region, our score and the rivals score.');return}
 S.mapq.unshift({region:r,year:document.getElementById('mqy').value.trim(),ours:o,rivals:v,countryOurs:0,countryRivals:0,borderOurs:0,borderRivals:0,best:'',wrong:'',date:todayS(),note:''});save();render()}
/** Parse a benchmark report document ("Rivals comparison <region> <year>"; Common/Country/Border score rows). Returns null if it is not one. */
function parseMapq(d){const m=String(d.title||'').match(/Rivals comparison\s+(.+?)\s+(-?\d{3,4})\s*$/i),T=(d.body?d.body.textContent:'').replace(/\s+/g,' ');
 const rows={};[...d.querySelectorAll('tr')].forEach(tr=>{const c=[...tr.children].map(x=>x.textContent.replace(/\s+/g,' ').trim());const k=(c[0]||'').match(/^(Common|Country|Border) score$/i);if(k&&c.length>=3&&!isNaN(parseFloat(c[1]))&&!isNaN(parseFloat(c[2])))rows[k[1].toLowerCase()]={riv:parseFloat(c[1]),our:parseFloat(c[2])}});
 const c=rows.common,co=rows.country,b=rows.border;if(!m||!c)return null;
 const best=T.match(/Best rival by common score:\s*([\w-]+)/i);let w=null;[...d.querySelectorAll('small')].some(td=>(w=td.textContent.replace(/\s+/g,' ').trim().match(/^(\d+) wrong \/ (\d+)$/)));
 return {region:m[1].replace(/_/g,' ').replace(/(^|\s)\S/g,x=>x.toUpperCase()),year:m[2],ours:c.our,rivals:c.riv,countryOurs:co?co.our:0,countryRivals:co?co.riv:0,borderOurs:b?b.our:0,borderRivals:b?b.riv:0,best:best?best[1]:'',wrong:w?w[1]+' of '+w[2]:'',date:todayS(),note:'Imported benchmark report.'}}
function importMapq(inp){const files=[...inp.files];let ok=0,bad=[],left=files.length;if(!left)return;
 files.forEach(f=>{const r=new FileReader();r.onload=()=>{try{const d=new DOMParser().parseFromString(r.result,'text/html'),row=parseMapq(d);
   if(row){const i=S.mapq.findIndex(x=>x.region.toLowerCase()===row.region.toLowerCase()&&String(x.year)===String(row.year));if(i>=0)S.mapq[i]={...S.mapq[i],...row,note:S.mapq[i].note||row.note};else S.mapq.unshift(row);ok++}else bad.push(f.name)}catch(e){bad.push(f.name)}
  if(--left===0){inp.value='';save();render();alert(ok+' benchmark(s) imported.'+(bad.length?'\nNot recognised: '+bad.join(', '):''))}};r.readAsText(f)})}

const VIEWS={analytics,progress,testers,conferences,grants,academia,communities,rivals,templates};
function go(p){page=p;render();window.scrollTo(0,0);if(p==='analytics')refreshFromServer().catch(()=>{})} // opening Analytics re-reads the saved data (testers edited elsewhere show up)
function render(){const nh=a=>(a||[]).filter(x=>!x.hidden).length,cnt={testers:S.testers.length,conferences:nh(S.confs),grants:nh(S.grants),academia:nh(S.unis),communities:nh(S.comms),services:[...S.grants,...S.confs,...S.comms,...S.rivals].filter(x=>x.isNew&&!x.hidden).length,rivals:nh(S.rivals),progress:S.roadmap.filter(x=>x.status==='progress').length};
 document.getElementById('nav').innerHTML=PAGES.map(([id,ic,l])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><b>${ic}</b><span class="t">${l}</span>${cnt[id]?`<span class="cnt">${cnt[id]}</span>`:''}</button>`).join('');
 const [e,t,s]=META[page];document.getElementById('eyebrow').textContent=e;document.getElementById('title').textContent=t;document.getElementById('subtitle').textContent=s;
 document.getElementById('content').innerHTML=VIEWS[page]();if(page==='templates')refreshTpl();enableResize();enableSort();bgLoad()}
boot();
</script>
