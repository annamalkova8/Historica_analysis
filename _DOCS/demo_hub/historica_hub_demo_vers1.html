<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historica Intelligence Hub — Concept Demo</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8eef9;background:#0a1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:248px;background:#0e172a;border-right:1px solid #23304a;padding:25px 14px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px;padding:5px 12px}.brand span{color:#6bb8ff}.sub{color:#8190aa;font-size:11px;letter-spacing:1.7px;text-transform:uppercase;padding:0 12px;margin:2px 0 35px}.nav{width:100%;text-align:left;color:#9dacc4;background:none;border:0;padding:13px 14px;border-radius:10px;margin:3px 0}.nav:hover,.nav.active{background:#203457;color:#fff}.nav b{display:inline-block;width:25px;font-size:16px}.foot{position:absolute;bottom:20px;color:#75849f;font-size:12px;padding:10px}.main{flex:1;min-width:0;padding:30px 38px;max-width:1600px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:26px}.eyebrow{color:#66b5ff;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1.6px}h1{font-size:29px;margin:6px 0 5px;letter-spacing:-.7px}p{color:#9aaac2;margin:0;line-height:1.55}.pill{border:1px solid #35547a;background:#142741;border-radius:30px;color:#8bcaff;padding:9px 13px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:23px 0}.card{background:#131f34;border:1px solid #273751;border-radius:14px;padding:20px;min-width:0}.metric{color:#93a5bf;font-size:12px}.number{font-size:29px;font-weight:750;margin:9px 0 3px}.trend{color:#61d4a4;font-size:12px}.muted{color:#8a9bb4;font-size:12px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin:16px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0 0 8px}.barrow{display:grid;grid-template-columns:125px 1fr 45px;gap:12px;align-items:center;margin:15px 0;font-size:12px;color:#b6c5d9}.track{background:#24324a;height:9px;border-radius:12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4e8af0,#65d5c0);border-radius:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#8598b2;font-weight:600;padding:13px 10px;border-bottom:1px solid #2b3950}td{padding:15px 10px;border-bottom:1px solid #25334a;color:#d7e0ee}tr:last-child td{border:0}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#263955;color:#a8c9ff;font-size:11px;white-space:nowrap}.status.green{background:#173c37;color:#70e0b7}.status.amber{background:#47371f;color:#f1c477}.btn{background:#438cf0;border:0;border-radius:9px;color:white;padding:10px 14px;font-size:12px;font-weight:700}.btn.secondary{background:#253853;color:#c9def7}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{background:#1a2a43;border:1px solid #31445f;color:#b9c9dd;border-radius:8px;padding:9px 14px}.tab.active{background:#28508a;color:white}.spark{width:100%;height:145px}.spark polyline{fill:none;stroke:#69b7ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.spark .area{fill:#1d436a;stroke:none;opacity:.45}.note{background:#17283e;border:1px solid #2e4d6e;border-radius:11px;padding:14px;color:#b3cce5;font-size:12px;line-height:1.6;margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{background:#0d182b;border:1px solid #30425e;border-radius:8px;color:#e9f0fa;padding:11px;width:100%;margin:7px 0}.survey{display:grid;gap:12px}.survey label{font-size:13px;color:#b8c8db}.progress{height:9px;border-radius:10px;background:#2a3951;overflow:hidden}.progress>div{height:100%;background:#63c8a6}.small{font-size:12px}.callout{border-left:3px solid #5c9df4;padding:9px 14px;background:#182b45;border-radius:5px;color:#c9d8eb}.kicker{font-size:11px;color:#8da0bb;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.timeline{display:flex;flex-direction:column;gap:14px}.timeline .item{border-left:2px solid #436ca4;padding-left:15px}.timeline .item strong{display:block;font-size:13px}.timeline .item small{color:#91a4bd}.banner{display:flex;align-items:center;justify-content:space-between;gap:12px}.mobilemenu{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr}.main{padding:24px}}@media(max-width:680px){.side{width:64px;padding:15px 5px}.brand{font-size:13px;padding:6px}.brand span,.sub,.nav .navtext,.foot{display:none}.nav{padding:13px 8px;text-align:center}.nav b{width:auto}.main{padding:16px}.top{align-items:flex-start}.pill{display:none}.stats{gap:9px}.card{padding:14px}.number{font-size:23px}.barrow{grid-template-columns:95px 1fr 32px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">H<span>istorica</span></div><div class="sub">Intelligence Hub</div><nav id="nav"></nav><div class="foot">INTERNAL CONCEPT<br>Illustrative data only · 2026</div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">Workspace overview</div><h1 id="title">Intelligence Overview</h1><p id="subtitle">Product insights, research, funding and academic growth in one place.</p></div><div class="pill">● Interactive concept · Demo data</div></div><div id="content"></div></main></div><script>
const pages=[['overview','◈','Overview'],['analytics','▥','Analytics'],['testers','♙','Map Builder Testers'],['grants','◇','Grants & Funding'],['conferences','▦','Conferences'],['academia','◎','Academic Network']];let page='overview',metric='Website',grantFilter='All';let grants=[['NLnet Open Internet','€50k','Nov 20, 2026','In preparation','Open-source infrastructure'],['Digital Humanities Programme','€100k','Dec 12, 2026','Researching','Digital heritage'],['European Innovation Challenge','€75k','Jan 15, 2027','Eligible','Innovation / EdTech'],['Open Knowledge Fund','€30k','Feb 5, 2027','Discovered','Open data']];let partners=[['University of Oxford','Digital Humanities','Prospect','Explore research collaboration'],['University of Amsterdam','Historical GIS','Contact planned','Map-based teaching'],['University of Helsinki','Digital History','Prospect','Data partnerships'],['Europeana Network','Cultural Heritage','Researching','Data interoperability']];let conferences=[['Digital Humanities 2027','Digital Humanities','Dec 15, 2026','CFP open'],['Historical GIS Symposium','GIS / History','Jan 10, 2027','Review'],['Open Source Summit','Open Source','Feb 8, 2027','Researching'],['EdTech Research Forum','Education','Mar 2, 2027','Discovered']];const card=(x)=>`<div class="card">${x}</div>`;const stat=(a,b,c)=>card(`<div class="metric">${a}</div><div class="number">${b}</div><div class="trend">${c}</div>`);const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const badge=s=>`<span class="status ${/submitted|active|eligible|open/i.test(s)?'green':/preparation|planned|review/i.test(s)?'amber':''}">${s}</span>`;const bars=(rows)=>rows.map(([a,n])=>`<div class="barrow"><span>${a}</span><div class="track"><div class="fill" style="width:${n}%"></div></div><span>${n}%</span></div>`).join('');const chart=()=>`<svg class="spark" viewBox="0 0 600 145" preserveAspectRatio="none"><path d="M0 140H600 M0 95H600 M0 50H600" stroke="#2a3a54" stroke-width="1"/><polygon class="area" points="0,116 55,104 110,111 165,75 220,83 275,61 330,71 385,39 440,56 495,20 550,32 600,9 600,145 0,145"/><polyline points="0,116 55,104 110,111 165,75 220,83 275,61 330,71 385,39 440,56 495,20 550,32 600,9"/></svg>`;const overview=()=>`<div class="note" style="margin-top:0">This is a clickable <b>concept prototype</b> for the Historica team. All figures, organizations, opportunities and deadlines shown here are illustrative—not live Historica data.</div><div class="stats">${stat('Website visits','12.8k','Illustrative · last 30 days')}${stat('Map views','8.4k','Requires event tracking')}${stat('Facebook engagement','6.2%','Illustrative rate')}${stat('Funding pipeline','€255k','Example opportunities')}</div><div class="grid">${card(`<div class="sectionhead"><h2>Audience activity</h2><span class="muted">Last 12 weeks · sample</span></div>${chart()}<div class="muted">Planned: website traffic, historical map engagement, Facebook insights</div>`)}${card(`<div class="sectionhead"><h2>Upcoming deadlines</h2><span class="muted">Illustrative</span></div><div class="timeline"><div class="item"><strong>NLnet Open Internet</strong><small>Nov 20 · Funding</small></div><div class="item"><strong>Digital Humanities Programme</strong><small>Dec 12 · Funding</small></div><div class="item"><strong>Digital Humanities 2027</strong><small>Dec 15 · Call for Papers</small></div></div>`)}</div><div class="grid">${card(`<div class="sectionhead"><h2>Map Builder research</h2><button class="btn secondary" onclick="go('testers')">Open research →</button></div><div class="two"><div><div class="metric">Illustrative survey responses</div><div class="number">24 / 40</div><div class="progress"><div style="width:60%"></div></div><p class="small" style="margin-top:12px">Survey collection → thematic analysis → prioritized UX backlog</p></div><div><div class="kicker">Common feedback themes</div>${bars([['Import workflow',82],['Editing tools',64],['Navigation',45]])}</div></div>`)}${card(`<div class="sectionhead"><h2>Development pipeline</h2><button class="btn secondary" onclick="go('academia')">Explore partners →</button></div><div class="number">4 <span class="muted">sample partners</span></div><p>Track academic prospects, collaboration ideas, outreach and next actions.</p><div class="note">AI-assisted discovery → human review → outreach → collaboration</div>`)}</div>`;
const analytics=()=>`<div class="tabs">${['Website','Historical Maps','Facebook'].map(t=>`<button class="tab ${metric===t?'active':''}" onclick="metric='${t}';render()">${t}</button>`).join('')}</div><div class="stats">${(metric==='Website'?[['Visits','12,840'],['Unique visitors','9,310'],['Top source','Organic'],['Pages viewed','28,600']]:metric==='Historical Maps'?[['Map views','8,420'],['Top period','1700–1800'],['Timeline interactions','3,240'],['Layer toggles','1,570']]:[['Post impressions','142k'],['Engagement rate','6.2%'],['Comments','820'],['Shares','1,240']]).map(([a,b])=>stat(a,b,'Illustrative demo value')).join('')}</div><div class="grid">${card(`<div class="sectionhead"><h2>${metric} trends</h2><span class="muted">Example visualization</span></div>${chart()}`)}${card(`<h2>${metric==='Website'?'Traffic sources':metric==='Historical Maps'?'Popular historical periods':'Engagement by topic'}</h2>${bars(metric==='Website'?[['Organic search',72],['Direct',48],['Social',34],['Referrals',19]]:metric==='Historical Maps'?[['1700–1800',82],['1900–2000',71],['Ancient',53],['Medieval',46]]:[['Border changes',87],['Historical maps',74],['Empires',63],['Map Builder',42]])}`)}</div>${card(`<div class="sectionhead"><h2>Data integration roadmap</h2>${badge('Planned')}</div>${table(['Source','Method','Requirement'],[['Website','Existing visit analytics','Analytics access'],['Historical maps','Frontend event tracking','Tracking specification + developer'],['Facebook','Meta Graph API','Page permissions and API access']])}<div class="note">Historica currently tracks visits, not detailed on-site user actions. Map interaction metrics in this demo are placeholders until tracking is implemented.</div>`)}`;
const testers=()=>`<div class="stats">${stat('Invited testers','40','Example cohort')}${stat('Survey responses','24','Example responses')}${stat('Completion rate','60%','Illustrative')}${stat('UX issues flagged','11','Illustrative')}</div><div class="grid">${card(`<div class="sectionhead"><h2>Map Builder feedback</h2><button class="btn" onclick="alert('Demo action: in the real portal this would open a survey builder.')">+ New survey</button></div>${table(['Survey','Audience','Responses','Status'],[['Map Builder beta usability','Early testers','24 / 40',badge('Active')],['GeoJSON import flow','Pilot group','8 / 12',badge('Active')],['New features feedback','Future release','—',badge('Planned')]])}`)}${card(`<h2>Example questionnaire</h2><div class="survey" style="margin-top:15px"><label>How easy was it to create your first map?<select class="field"><option>Choose rating</option><option>Very easy</option><option>Somewhat easy</option><option>Difficult</option></select></label><label>Which feature needs improvement?<select class="field"><option>Choose feature</option><option>GeoJSON import</option><option>Object editing</option><option>Timeline</option><option>Navigation</option></select></label><label>What would you change?<input class="field" placeholder="Open feedback"></label><button class="btn" onclick="alert('Demo only: no responses are stored.')">Preview response</button></div>`)}</div>${card(`<h2>Feedback analysis pipeline</h2><div class="note">Survey responses → anonymization → LLM theme classification → frequency/severity review → prioritized UX recommendations</div>`)}`;
const grantsPage=()=>`<div class="stats">${stat('Opportunities','4','Example entries')}${stat('In preparation','1','Example')}${stat('Funding identified','€255k','Not verified')}${stat('Next deadline','Nov 20','Example date')}</div>${card(`<div class="sectionhead"><h2>Grant application pipeline</h2><div class="actions"><select class="field" style="width:150px;margin:0" onchange="grantFilter=this.value;render()"><option ${grantFilter==='All'?'selected':''}>All</option>${['Researching','Eligible','In preparation','Discovered'].map(x=>`<option ${grantFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="addGrant()">+ Add opportunity</button></div></div>${table(['Opportunity','Potential funding','Deadline','Status','Focus'],grants.filter(g=>grantFilter==='All'||g[3]===grantFilter).map(g=>[g[0],g[1],g[2],badge(g[3]),g[4]]))}<div class="note">Production workflow: discovery → eligibility check → proposal drafting → documents and pitch deck → submission → decision → reporting.</div>`)}`;
const conferencePage=()=>`<div class="stats">${stat('Tracked events','4','Example entries')}${stat('Open CFPs','1','Example')}${stat('Upcoming deadlines','4','Illustrative')}${stat('Submitted talks','0','Demo state')}</div>${card(`<div class="sectionhead"><h2>Conference & Call for Papers tracker</h2><button class="btn" onclick="addConference()">+ Add conference</button></div>${table(['Conference','Focus','CFP / review date','Status'],conferences.map(c=>[c[0],c[1],c[2],badge(c[3])]))}<div class="note">Planned automation: monitor official CFP pages, extract dates and requirements, flag upcoming deadlines, and prepare submission materials.</div>`)}`;
const academiaPage=()=>`<div class="stats">${stat('Prospective partners','4','Example entries')}${stat('Research areas','4','Example categories')}${stat('Outreach planned','1','Illustrative')}${stat('Active partnerships','—','Not connected to CRM')}</div>${card(`<div class="sectionhead"><h2>Academic collaboration pipeline</h2><button class="btn" onclick="addPartner()">+ Add organization</button></div>${table(['Organization','Research area','Stage','Collaboration idea'],partners.map(p=>[p[0],p[1],badge(p[2]),p[3]]))}<div class="note">Potential use cases: university teaching, historical GIS research, shared datasets, digital heritage collaborations and scientific outreach.</div>`)}`;
const views={overview,analytics,testers,grants:grantsPage,conferences:conferencePage,academia:academiaPage};const subtitles={overview:['Workspace overview','Intelligence Overview','Product insights, research, funding and academic growth in one place.'],analytics:['Product intelligence','Audience & Product Analytics','Website, historical maps and Facebook reporting.'],testers:['User research','Map Builder Testers','Survey management, beta feedback and usability insights.'],grants:['Funding pipeline','Grants & Funding','Find, evaluate, prepare and track funding applications.'],conferences:['Events & outreach','Conferences','Track relevant events, CFPs, deadlines and submissions.'],academia:['Partnership development','Academic Network','Build relationships with universities and research organizations.']};function go(p){page=p;render();window.scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=pages.map(([id,ic,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><b>${ic}</b><span class="navtext">${label}</span></button>`).join('');let [e,t,s]=subtitles[page];document.getElementById('eyebrow').textContent=e;document.getElementById('title').textContent=t;document.getElementById('subtitle').textContent=s;document.getElementById('content').innerHTML=views[page]()}function addGrant(){let n=prompt('Grant name (demo, local to this page):');if(n?.trim()){grants.unshift([n.trim(),'TBD','TBD','Discovered','To evaluate']);grantFilter='All';render()}}function addConference(){let n=prompt('Conference name (demo):');if(n?.trim()){conferences.unshift([n.trim(),'TBD','TBD','Discovered']);render()}}function addPartner(){let n=prompt('Organization name (demo):');if(n?.trim()){partners.unshift([n.trim(),'TBD','Prospect','To explore']);render()}}render();
</script></body></html>
